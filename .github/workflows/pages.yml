# Publish examples/ to GitHub Pages on every push to main.
#
# The example is the PROOF for one of this package's own requirements — that a
# plain HTML page with no bundler can load it — so it ships the real built
# global bundle rather than a copy that can rot. The build runs here and the
# result is what gets deployed.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

      # Copy the FRESH bundle over the committed one, so the page can never
      # demonstrate a version that is no longer what this repo builds.
      - run: cp dist/sgiant-ai-widget.global.js examples/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: examples
      - id: deploy
        uses: actions/deploy-pages@v5
