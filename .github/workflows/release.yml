# Publish to public npm when a v* tag is pushed.
#
# Tag-gated rather than push-to-main: a version number is a deliberate act, and
# npm will not let you re-publish over one. `npm ci` + a clean build means the
# artefact comes from the tag and not from whatever was on someone's laptop.
#
# The tag has to be on main. The job refuses, before it installs anything, a
# tag that is not one of main's own commits (its first-parent line: this
# repository takes real merges); and before it publishes, a tag whose name is
# not the version in package.json.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    # Pinned, not `ubuntu-latest`: that label moves to a new Ubuntu on GitHub's
    # schedule, and a publish job should change its OS when this file does.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # provenance: npm records which workflow built the tarball
    steps:
      - uses: actions/checkout@v7
        with:
          # All of history, not the default single commit: the next step asks
          # whether this commit is on main, and one commit cannot answer that.
          fetch-depth: 0

      # THE TAG MUST BE ON MAIN.
      #
      # Everything below checks the tag's NAME against package.json and nothing
      # about WHERE the tag is. A v* tag on a branch, or on a commit that was
      # never merged, would build, pass and publish code that main does not
      # have, under a number that can never be used again. Here, before
      # anything is installed or built, so a misplaced tag costs seconds and
      # spends nothing: delete it, tag main, push again.
      #
      # ON MAIN'S OWN LINE, not merely in its history. This repository has real
      # merge commits (15 of them, as of 1.28.0). A commit of a branch that was
      # merged that way is an ancestor of main and was still never main: its
      # tree is the branch's. So the tag has to be one of the commits main
      # itself has pointed at (its first-parent line). For a squashed commit
      # the two are the same thing. The agent bridge's release does the same.
      #
      # main is fetched explicitly rather than trusted from the checkout, so the
      # answer is about main as it is now. The list goes to a file because
      # `rev-list | grep -q` can fail under pipefail once the list outgrows the
      # pipe buffer: grep exits on its match and rev-list dies on SIGPIPE.
      - name: tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git rev-list --first-parent origin/main > "${RUNNER_TEMP:-/tmp}/main-line"
          if ! grep -qx "$(git rev-parse HEAD)" "${RUNNER_TEMP:-/tmp}/main-line"; then
            echo "REFUSING: $GITHUB_REF_NAME is $(git rev-parse --short HEAD), which is not a commit of main"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is $(git rev-parse --short HEAD), on main"
      # v6, not v7, on purpose. v7 stops exporting the placeholder
      # NODE_AUTH_TOKEN that the .npmrc written here still refers to, which
      # changes what npm sees at publish time — and the only way to test that is
      # to publish. v6 runs on Node 24 and leaves the auth path as it was.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # TRUSTED PUBLISHING NEEDS A NEWER npm THAN NODE SHIPS.
      #
      # Node 22 bundles npm 10, which has no idea what OIDC is: it looks for
      # NODE_AUTH_TOKEN, finds none, and fails as if the credential were
      # missing rather than saying the CLI is too old. 11.5.1 is the first
      # version that exchanges the workflow's id-token for a publish
      # credential, and it is pinned rather than floating because a release
      # that changes its own toolchain silently is one that cannot be
      # reproduced.
      - run: npm install -g npm@11.5.1

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # The suite that came with the package when it was extracted — 73 tests
      # that had been running in the monorepo it left. A published package whose
      # tests stayed behind is a package with no tests.
      - run: npm test

      # The tarball audit. `prepublishOnly` runs it again during publish, but
      # having it as its own step means a leak fails with a readable log line
      # rather than inside npm's publish output.
      - run: npm run audit

      # The tag must match the version being published, or `npm dist-tag` lies
      # about what v1.2.3 contains for the rest of the package's life.
      - name: tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          test "$tag" = "$pkg" || {
            echo "REFUSING: tag $GITHUB_REF_NAME does not match version $pkg"
            exit 1
          }

      # NO TOKEN. The package trusts THIS repository and THIS workflow file
      # through OIDC, so npm exchanges the `id-token` above for a short-lived
      # publish credential at the moment of publishing.
      #
      # Two tokens were tried before this and both failed identically — auth
      # succeeded, the tarball built, the provenance statement signed and
      # reached the transparency log, and only then npm refused the write with
      # EOTP. The package requires 2FA or a granular token with bypass-2fa
      # enabled, and neither token had that box ticked. Trusted publishing
      # removes the question: there is no secret to scope wrongly, leak or
      # rotate, and the package's strict 2FA setting stays on.
      #
      # `--provenance` is unchanged and now doubles as the credential's own
      # evidence: the same signed claim about which workflow built the tarball.
      - run: npm publish --provenance --access public
