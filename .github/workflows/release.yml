# Publish to public npm when a v* tag is pushed.
#
# Tag-gated rather than push-to-main: a version number is a deliberate act, and
# npm will not let you re-publish over one. `npm ci` + a clean build means the
# artefact comes from the tag and not from whatever was on someone's laptop.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance: npm records which workflow built the tarball
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # TRUSTED PUBLISHING NEEDS A NEWER npm THAN NODE SHIPS.
      #
      # Node 22 bundles npm 10, which has no idea what OIDC is: it looks for
      # NODE_AUTH_TOKEN, finds none, and fails as if the credential were
      # missing rather than saying the CLI is too old. 11.5.1 is the first
      # version that exchanges the workflow's id-token for a publish
      # credential, and it is pinned rather than floating because a release
      # that changes its own toolchain silently is one that cannot be
      # reproduced.
      - run: npm install -g npm@11.5.1

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # The suite that came with the package when it was extracted — 73 tests
      # that had been running in the monorepo it left. A published package whose
      # tests stayed behind is a package with no tests.
      - run: npm test

      # The tarball audit. `prepublishOnly` runs it again during publish, but
      # having it as its own step means a leak fails with a readable log line
      # rather than inside npm's publish output.
      - run: npm run audit

      # The tag must match the version being published, or `npm dist-tag` lies
      # about what v1.2.3 contains for the rest of the package's life.
      - name: tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          test "$tag" = "$pkg" || {
            echo "REFUSING: tag $GITHUB_REF_NAME does not match version $pkg"
            exit 1
          }

      # NO TOKEN. The package trusts THIS repository and THIS workflow file
      # through OIDC, so npm exchanges the `id-token` above for a short-lived
      # publish credential at the moment of publishing.
      #
      # Two tokens were tried before this and both failed identically — auth
      # succeeded, the tarball built, the provenance statement signed and
      # reached the transparency log, and only then npm refused the write with
      # EOTP. The package requires 2FA or a granular token with bypass-2fa
      # enabled, and neither token had that box ticked. Trusted publishing
      # removes the question: there is no secret to scope wrongly, leak or
      # rotate, and the package's strict 2FA setting stays on.
      #
      # `--provenance` is unchanged and now doubles as the credential's own
      # evidence: the same signed claim about which workflow built the tarball.
      - run: npm publish --provenance --access public
